<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="mgr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1000" height="1180" fill="url(#bg)"/>
  <rect x="24" y="24" width="952" height="1132" rx="28" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>

  <!-- header -->
  <g transform="translate(60,70)">
    <circle cx="34" cy="30" r="34" fill="#ede9fe"/>
    <g stroke="#7c3aed" stroke-width="3" fill="#7c3aed">
      <circle cx="34" cy="16" r="5"/><circle cx="20" cy="34" r="5"/><circle cx="48" cy="34" r="5"/>
      <circle cx="28" cy="48" r="5"/><circle cx="44" cy="48" r="5"/>
      <line x1="34" y1="16" x2="20" y2="34"/><line x1="34" y1="16" x2="48" y2="34"/>
      <line x1="20" y1="34" x2="28" y2="48"/><line x1="48" y1="34" x2="44" y2="48"/>
      <line x1="28" y1="48" x2="44" y2="48"/><line x1="20" y1="34" x2="48" y2="34"/>
    </g>
    <text x="92" y="32" font-size="46" font-weight="800" fill="#5b21b6">AgentMem</text>
    <text x="92" y="66" font-size="22" fill="#7c3aed">Agent Memory — agents that remember across turns, sessions &amp; tasks</text>
  </g>
  <line x1="60" y1="158" x2="940" y2="158" stroke="#e9d5ff" stroke-width="2"/>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="60" y="186" width="220" height="70" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <text x="170" y="220" font-size="20" font-weight="700" fill="#3730a3" text-anchor="middle">User / Agent</text>
  <text x="170" y="244" font-size="15" fill="#6366f1" text-anchor="middle">new event · message · tool result</text>

  <!-- arrow to manager -->
  <line x1="280" y1="221" x2="370" y2="221" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- memory manager -->
  <g filter="url(#shadow)">
    <rect x="380" y="180" width="560" height="82" rx="16" fill="url(#mgr)"/>
  </g>
  <text x="660" y="214" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">MEMORY MANAGER</text>
  <text x="660" y="244" font-size="17" fill="#e9d5ff" text-anchor="middle">write  ·  read  ·  update  ·  consolidate  ·  decay / forget</text>

  <!-- distribution lines to 4 stores -->
  <line x1="660" y1="262" x2="660" y2="300" stroke="#6d28d9" stroke-width="3"/>
  <line x1="170" y1="300" x2="830" y2="300" stroke="#6d28d9" stroke-width="3"/>
  <line x1="170" y1="300" x2="170" y2="338" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="383" y1="300" x2="383" y2="338" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="597" y1="300" x2="597" y2="338" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="830" y1="300" x2="830" y2="338" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 4 memory type cards -->
  <!-- card template y=348 height=250 width=200 -->
  <g filter="url(#shadow)">
    <rect x="70" y="348" width="200" height="260" rx="16" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
  </g>
  <rect x="70" y="348" width="200" height="48" rx="16" fill="#06b6d4"/>
  <rect x="70" y="372" width="200" height="24" fill="#06b6d4"/>
  <text x="170" y="379" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">SHORT-TERM</text>
  <text x="170" y="418" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle">working memory</text>
  <text x="170" y="452" font-size="14" fill="#155e75" text-anchor="middle">• context window</text>
  <text x="170" y="478" font-size="14" fill="#155e75" text-anchor="middle">• scratchpad</text>
  <text x="170" y="504" font-size="14" fill="#155e75" text-anchor="middle">• current task state</text>
  <g transform="translate(152,548)" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round">
    <rect x="0" y="0" width="36" height="44" rx="4" fill="#cffafe"/>
    <line x1="8" y1="12" x2="28" y2="12"/><line x1="8" y1="22" x2="28" y2="22"/><line x1="8" y1="32" x2="20" y2="32"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="283" y="348" width="200" height="260" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <rect x="283" y="348" width="200" height="48" rx="16" fill="#22c55e"/>
  <rect x="283" y="372" width="200" height="24" fill="#22c55e"/>
  <text x="383" y="379" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">LONG-TERM</text>
  <text x="383" y="418" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">semantic facts</text>
  <text x="383" y="452" font-size="14" fill="#166534" text-anchor="middle">• preferences</text>
  <text x="383" y="478" font-size="14" fill="#166534" text-anchor="middle">• vector store</text>
  <text x="383" y="504" font-size="14" fill="#166534" text-anchor="middle">• knowledge graph</text>
  <g transform="translate(365,548)" fill="#bbf7d0" stroke="#22c55e" stroke-width="3">
    <ellipse cx="18" cy="6" rx="18" ry="6"/>
    <path d="M0,6 V38 a18,6 0 0 0 36,0 V6" fill="#bbf7d0"/>
    <ellipse cx="18" cy="6" rx="18" ry="6" fill="#dcfce7"/>
    <path d="M0,22 a18,6 0 0 0 36,0" fill="none"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="496" y="348" width="200" height="260" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  </g>
  <rect x="496" y="348" width="200" height="48" rx="16" fill="#f97316"/>
  <rect x="496" y="372" width="200" height="24" fill="#f97316"/>
  <text x="596" y="379" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">EPISODIC</text>
  <text x="596" y="418" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">past experiences</text>
  <text x="596" y="452" font-size="14" fill="#9a3412" text-anchor="middle">• past sessions</text>
  <text x="596" y="478" font-size="14" fill="#9a3412" text-anchor="middle">• tool outcomes</text>
  <text x="596" y="504" font-size="14" fill="#9a3412" text-anchor="middle">• event history</text>
  <g transform="translate(572,548)" fill="#fed7aa" stroke="#f97316" stroke-width="3">
    <rect x="0" y="0" width="48" height="40" rx="4" fill="#ffedd5"/>
    <rect x="6" y="8" width="14" height="10" fill="#fed7aa"/><rect x="28" y="8" width="14" height="10" fill="#fed7aa"/>
    <rect x="6" y="22" width="14" height="10" fill="#fed7aa"/><rect x="28" y="22" width="14" height="10" fill="#fed7aa"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="709" y="348" width="200" height="260" rx="16" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="2"/>
  </g>
  <rect x="709" y="348" width="200" height="48" rx="16" fill="#d946ef"/>
  <rect x="709" y="372" width="200" height="24" fill="#d946ef"/>
  <text x="809" y="379" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">PROCEDURAL</text>
  <text x="809" y="418" font-size="14" font-weight="700" fill="#a21caf" text-anchor="middle">learned skills</text>
  <text x="809" y="452" font-size="14" fill="#86198f" text-anchor="middle">• how-to / routines</text>
  <text x="809" y="478" font-size="14" fill="#86198f" text-anchor="middle">• reusable workflows</text>
  <text x="809" y="504" font-size="14" fill="#86198f" text-anchor="middle">• prompt patterns</text>
  <g transform="translate(791,548)" fill="#f5d0fe" stroke="#d946ef" stroke-width="3">
    <path d="M18,2 l4,0 l1.5,5 l4,2 l5,-2 l2.5,3.5 l-3.5,4 l0,4 l3.5,4 l-2.5,3.5 l-5,-2 l-4,2 l-1.5,5 l-4,0 l-1.5,-5 l-4,-2 l-5,2 l-2.5,-3.5 l3.5,-4 l0,-4 l-3.5,-4 l2.5,-3.5 l5,2 l4,-2 z"/>
    <circle cx="20" cy="20" r="6" fill="#fdf4ff"/>
  </g>

  <!-- converge to retrieve -->
  <line x1="170" y1="608" x2="170" y2="648" stroke="#6d28d9" stroke-width="3"/>
  <line x1="383" y1="608" x2="383" y2="648" stroke="#6d28d9" stroke-width="3"/>
  <line x1="596" y1="608" x2="596" y2="648" stroke="#6d28d9" stroke-width="3"/>
  <line x1="809" y1="608" x2="809" y2="648" stroke="#6d28d9" stroke-width="3"/>
  <line x1="170" y1="648" x2="809" y2="648" stroke="#6d28d9" stroke-width="3"/>
  <line x1="490" y1="648" x2="490" y2="686" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- retrieve + inject -->
  <g filter="url(#shadow)">
    <rect x="300" y="694" width="380" height="78" rx="16" fill="#1e1b4b"/>
  </g>
  <text x="490" y="728" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">RETRIEVE + RANK + INJECT</text>
  <text x="490" y="754" font-size="15" fill="#c4b5fd" text-anchor="middle">relevant memories summarized into the prompt</text>

  <!-- arrow to LLM -->
  <line x1="680" y1="733" x2="770" y2="733" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="780" y="700" width="150" height="66" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <text x="855" y="730" font-size="20" font-weight="800" fill="#3730a3" text-anchor="middle">LLM Agent</text>
  <text x="855" y="752" font-size="14" fill="#6366f1" text-anchor="middle">grounded reply</text>

  <!-- feedback loop -->
  <path d="M780,733 C740,820 560,820 490,795 C420,820 260,820 220,790 L220,256"
        fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="250" y="430" font-size="13" fill="#7c3aed" transform="rotate(-90 250 430)">write new memories back</text>

  <!-- comparison footer -->
  <line x1="60" y1="848" x2="940" y2="848" stroke="#e9d5ff" stroke-width="2"/>
  <text x="60" y="888" font-size="22" font-weight="800" fill="#5b21b6">How AgentMem relates to MCP · RAG · AI Agents</text>

  <g font-size="15">
    <!-- row 1 -->
    <rect x="60" y="908" width="200" height="52" rx="10" fill="#dbeafe"/>
    <text x="80" y="940" font-weight="800" fill="#1e40af">MCP</text>
    <text x="290" y="940" fill="#334155">standard way for LLMs to <tspan font-weight="700">use tools</tspan></text>

    <rect x="60" y="968" width="200" height="52" rx="10" fill="#dcfce7"/>
    <text x="80" y="1000" font-weight="800" fill="#15803d">RAG</text>
    <text x="290" y="1000" fill="#334155">augments the LLM with <tspan font-weight="700">retrieved external knowledge</tspan></text>

    <rect x="60" y="1028" width="200" height="52" rx="10" fill="#ede9fe"/>
    <text x="80" y="1060" font-weight="800" fill="#6d28d9">AI Agent</text>
    <text x="290" y="1060" fill="#334155">an LLM that can <tspan font-weight="700">plan and take actions</tspan></text>

    <rect x="60" y="1088" width="200" height="52" rx="10" fill="#7c3aed"/>
    <text x="80" y="1120" font-weight="800" fill="#ffffff">AgentMem</text>
    <text x="290" y="1120" fill="#334155">gives the agent <tspan font-weight="700">persistent memory</tspan> to remember across time</text>
  </g>
</svg>
